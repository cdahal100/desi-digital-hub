<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White/light gradients for dark backgrounds -->
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light blue gradient for accents -->
    <linearGradient id="lightBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bfdbfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light accent gradient -->
    <linearGradient id="lightAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Light shadow filter -->
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Light cultural pattern -->
    <pattern id="lightCulturalPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="rgba(255, 255, 255, 0.1)"/>
      <circle cx="4" cy="4" r="2.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="240" height="60" fill="url(#lightCulturalPattern)" opacity="0.3"/>
  
  <!-- Main logo container -->
  <g filter="url(#lightShadow)">
    
    <!-- Enhanced logo symbol -->
    <g transform="translate(8, 8)">
      <!-- Outer ornamental ring -->
      <circle cx="22" cy="22" r="20" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      
      <!-- Inner mandala-inspired design -->
      <g transform="translate(22, 22)">
        <!-- Central diamond with depth -->
        <path d="M0 -12 L10 0 L0 12 L-10 0 Z" 
              fill="url(#lightBlueGradient)" 
              opacity="0.8"/>
        
        <!-- Secondary diamond overlay -->
        <path d="M0 -8 L6 0 L0 8 L-6 0 Z" 
              fill="url(#whiteGradient)" 
              opacity="0.9"/>
        
        <!-- Cultural accent dots -->
        <circle cx="0" cy="-6" r="2" fill="url(#lightAccentGradient)" opacity="0.8"/>
        <circle cx="6" cy="0" r="2" fill="url(#lightAccentGradient)" opacity="0.8"/>
        <circle cx="0" cy="6" r="2" fill="url(#lightAccentGradient)" opacity="0.8"/>
        <circle cx="-6" cy="0" r="2" fill="url(#lightAccentGradient)" opacity="0.8"/>
        
        <!-- Inner ornamental lines -->
        <path d="M-8 0 L8 0 M0 -8 L0 8" 
              stroke="rgba(255,255,255,0.6)" 
              stroke-width="1"/>
        
        <!-- Center focal point -->
        <circle cx="0" cy="0" r="2.5" fill="url(#whiteGradient)"/>
        <circle cx="0" cy="0" r="1" fill="rgba(255,255,255,0.9)"/>
      </g>
      
      <!-- Stylized "D" letterform integrated with symbol -->
      <path d="M12 12 L12 32 L22 32 Q32 32 32 22 Q32 12 22 12 Z M18 18 L22 18 Q26 18 26 22 Q26 26 22 26 L18 26 Z" 
            fill="url(#whiteGradient)" 
            opacity="0.95"/>
    </g>
    
    <!-- Enhanced typography -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- "DESI" in larger, bolder text -->
      <text x="60" y="28" 
            font-size="22" 
            font-weight="800"
            fill="white" 
            letter-spacing="-0.5px">DESI</text>
      
      <!-- "DIGITAL HUB" with more prominence -->
      <text x="60" y="45" 
            font-size="14" 
            font-weight="700"
            fill="rgba(255,255,255,0.9)" 
            letter-spacing="0.5px">DIGITAL HUB</text>
    </g>
    
    <!-- Decorative accent line -->
    <line x1="60" y1="32" x2="200" y2="32" 
          stroke="rgba(255,255,255,0.4)" 
          stroke-width="1"/>
    
    <!-- Cultural tagline -->
    <text x="60" y="54" 
          font-family="Inter, sans-serif"
          font-size="8" 
          font-weight="600"
          fill="rgba(255,255,255,0.7)" 
          letter-spacing="1px">CONNECTING CULTURES DIGITALLY</text>
    
    <!-- Corner ornaments -->
    <g transform="translate(220, 10)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255,255,255,0.7)"/>
      <path d="M-2 0 L2 0 M0 -2 L0 2" stroke="rgba(255,255,255,0.9)" stroke-width="0.5"/>
    </g>
    
    <g transform="translate(220, 50)">
      <circle cx="0" cy="0" r="2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="0.8" fill="rgba(255,255,255,0.6)"/>
    </g>
    
  </g>
</svg>
