<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced cultural gradient with more depth -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    
    <!-- Himalayan gradient with deeper blues -->
    <linearGradient id="himalayanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feFlood flood-color="#1e293b" flood-opacity="0.2"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Cultural pattern -->
    <pattern id="culturalPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="rgba(251, 191, 36, 0.15)"/>
      <circle cx="4" cy="4" r="2.5" fill="none" stroke="rgba(251, 191, 36, 0.1)" stroke-width="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="240" height="60" fill="url(#culturalPattern)" opacity="0.5"/>
  
  <!-- Main logo container -->
  <g filter="url(#dropShadow)">
    
    <!-- Enhanced logo symbol -->
    <g transform="translate(8, 8)">
      <!-- Outer ornamental ring -->
      <circle cx="22" cy="22" r="20" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.3"/>
      
      <!-- Inner mandala-inspired design -->
      <g transform="translate(22, 22)">
        <!-- Central diamond with depth -->
        <path d="M0 -12 L10 0 L0 12 L-10 0 Z" 
              fill="url(#himalayanGradient)" 
              opacity="0.8"/>
        
        <!-- Secondary diamond overlay -->
        <path d="M0 -8 L6 0 L0 8 L-6 0 Z" 
              fill="url(#primaryGradient)" 
              opacity="0.7"/>
        
        <!-- Cultural accent dots -->
        <circle cx="0" cy="-6" r="2" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="6" cy="0" r="2" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="0" cy="6" r="2" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="-6" cy="0" r="2" fill="url(#accentGradient)" opacity="0.9"/>
        
        <!-- Inner ornamental lines -->
        <path d="M-8 0 L8 0 M0 -8 L0 8" 
              stroke="url(#accentGradient)" 
              stroke-width="1" 
              opacity="0.5"/>
        
        <!-- Center focal point -->
        <circle cx="0" cy="0" r="2.5" fill="url(#primaryGradient)"/>
        <circle cx="0" cy="0" r="1" fill="white" opacity="0.8"/>
      </g>
      
      <!-- Stylized "D" letterform integrated with symbol -->
      <path d="M12 12 L12 32 L22 32 Q32 32 32 22 Q32 12 22 12 Z M18 18 L22 18 Q26 18 26 22 Q26 26 22 26 L18 26 Z" 
            fill="url(#primaryGradient)" 
            opacity="0.9"/>
    </g>
    
    <!-- Enhanced typography -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- "DESI" in larger, bolder text -->
      <text x="60" y="28" 
            font-size="22" 
            font-weight="800"
            fill="url(#primaryGradient)" 
            letter-spacing="-0.5px">DESI</text>
      
      <!-- "DIGITAL HUB" with more prominence -->
      <text x="60" y="45" 
            font-size="14" 
            font-weight="700"
            fill="url(#himalayanGradient)" 
            letter-spacing="0.5px">DIGITAL HUB</text>
    </g>
    
    <!-- Decorative accent line -->
    <line x1="60" y1="32" x2="200" y2="32" 
          stroke="url(#accentGradient)" 
          stroke-width="1" 
          opacity="0.4"/>
    
    <!-- Cultural tagline -->
    <text x="60" y="54" 
          font-family="Inter, sans-serif"
          font-size="8" 
          font-weight="600"
          fill="#64748b" 
          letter-spacing="1px">CONNECTING CULTURES DIGITALLY</text>
    
    <!-- Corner ornaments -->
    <g transform="translate(220, 10)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="url(#accentGradient)" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="url(#primaryGradient)" opacity="0.7"/>
      <path d="M-2 0 L2 0 M0 -2 L0 2" stroke="white" stroke-width="0.5" opacity="0.8"/>
    </g>
    
    <g transform="translate(220, 50)">
      <circle cx="0" cy="0" r="2" fill="none" stroke="url(#himalayanGradient)" stroke-width="0.6" opacity="0.5"/>
      <circle cx="0" cy="0" r="0.8" fill="url(#accentGradient)" opacity="0.6"/>
    </g>
    
  </g>
</svg>
