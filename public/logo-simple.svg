<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced cultural gradient with more depth -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
    
    <!-- Himalayan gradient with deeper blues -->
    <linearGradient id="himalayanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feFlood flood-color="#1e293b" flood-opacity="0.2"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Cultural pattern -->
    <pattern id="culturalPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="rgba(251, 191, 36, 0.15)"/>
      <circle cx="4" cy="4" r="2.5" fill="none" stroke="rgba(251, 191, 36, 0.1)" stroke-width="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="200" height="50" fill="url(#culturalPattern)" opacity="0.5"/>
  
  <!-- Main logo container -->
  <g filter="url(#dropShadow)">
    
    <!-- Enhanced logo symbol -->
    <g transform="translate(5, 5)">
      <!-- Outer ornamental ring -->
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.3"/>
      
      <!-- Inner mandala-inspired design -->
      <g transform="translate(20, 20)">
        <!-- Central diamond with depth -->
        <path d="M0 -10 L8 0 L0 10 L-8 0 Z" 
              fill="url(#himalayanGradient)" 
              opacity="0.8"/>
        
        <!-- Secondary diamond overlay -->
        <path d="M0 -6 L5 0 L0 6 L-5 0 Z" 
              fill="url(#primaryGradient)" 
              opacity="0.7"/>
        
        <!-- Cultural accent dots -->
        <circle cx="0" cy="-5" r="1.5" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="5" cy="0" r="1.5" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="0" cy="5" r="1.5" fill="url(#accentGradient)" opacity="0.9"/>
        <circle cx="-5" cy="0" r="1.5" fill="url(#accentGradient)" opacity="0.9"/>
        
        <!-- Inner ornamental lines -->
        <path d="M-6 0 L6 0 M0 -6 L0 6" 
              stroke="url(#accentGradient)" 
              stroke-width="1" 
              opacity="0.5"/>
        
        <!-- Center focal point -->
        <circle cx="0" cy="0" r="2" fill="url(#primaryGradient)"/>
        <circle cx="0" cy="0" r="0.8" fill="white" opacity="0.8"/>
      </g>
      
      <!-- Stylized "D" letterform integrated with symbol -->
      <path d="M10 10 L10 30 L20 30 Q30 30 30 20 Q30 10 20 10 Z M16 16 L20 16 Q24 16 24 20 Q24 24 20 24 L16 24 Z" 
            fill="url(#primaryGradient)" 
            opacity="0.9"/>
    </g>
    
    <!-- Enhanced typography - repositioned and resized -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- "DESI" in larger, bolder text -->
      <text x="55" y="22" 
            font-size="18" 
            font-weight="800"
            fill="url(#primaryGradient)" 
            letter-spacing="-0.5px">DESI</text>
      
      <!-- "DIGITAL HUB" with more prominence -->
      <text x="55" y="36" 
            font-size="12" 
            font-weight="700"
            fill="url(#himalayanGradient)" 
            letter-spacing="0.5px">DIGITAL HUB</text>
    </g>
    
    <!-- Decorative accent line -->
    <line x1="55" y1="26" x2="175" y2="26" 
          stroke="url(#accentGradient)" 
          stroke-width="1" 
          opacity="0.4"/>
    
    <!-- Corner ornaments -->
    <g transform="translate(185, 8)">
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="url(#accentGradient)" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.2" fill="url(#primaryGradient)" opacity="0.7"/>
      <path d="M-1.5 0 L1.5 0 M0 -1.5 L0 1.5" stroke="white" stroke-width="0.4" opacity="0.8"/>
    </g>
    
    <g transform="translate(185, 42)">
      <circle cx="0" cy="0" r="1.8" fill="none" stroke="url(#himalayanGradient)" stroke-width="0.6" opacity="0.5"/>
      <circle cx="0" cy="0" r="0.7" fill="url(#accentGradient)" opacity="0.6"/>
    </g>
    
  </g>
</svg>
