<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cultural gradient definition -->
    <linearGradient id="culturalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc267f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Himalayan gradient definition -->
    <linearGradient id="himalayanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="30" fill="url(#culturalGradient)" opacity="0.1"/>
  
  <!-- Outer ring -->
  <circle cx="30" cy="30" r="25" fill="none" stroke="url(#culturalGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Cultural mandala pattern -->
  <g fill="url(#himalayanGradient)">
    <!-- Central diamond -->
    <path d="M30 15 L40 25 L30 35 L20 25 Z" opacity="0.8"/>
    
    <!-- Surrounding elements -->
    <circle cx="30" cy="20" r="3" opacity="0.6"/>
    <circle cx="35" cy="30" r="3" opacity="0.6"/>
    <circle cx="30" cy="40" r="3" opacity="0.6"/>
    <circle cx="25" cy="30" r="3" opacity="0.6"/>
    
    <!-- Connection points -->
    <circle cx="30" cy="12" r="2" fill="#4f46e5"/>
    <circle cx="42" cy="30" r="2" fill="#4f46e5"/>
    <circle cx="30" cy="48" r="2" fill="#4f46e5"/>
    <circle cx="18" cy="30" r="2" fill="#4f46e5"/>
  </g>
  
  <!-- Central "D" -->
  <path d="M25 20 L25 40 L32 40 Q38 40 38 30 Q38 20 32 20 Z" 
        fill="url(#culturalGradient)" 
        filter="url(#glow)"/>
</svg>
