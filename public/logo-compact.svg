<svg viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cultural gradient definition -->
    <linearGradient id="culturalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc267f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Himalayan gradient definition -->
    <linearGradient id="himalayanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Compact logo symbol -->
  <g transform="translate(5, 5)">
    <!-- Simplified cultural symbol -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#culturalGradient)" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Central "D" with cultural elements -->
    <g fill="url(#himalayanGradient)">
      <!-- Central diamond -->
      <path d="M20 10 L28 18 L20 26 L12 18 Z" opacity="0.7"/>
      
      <!-- Corner accents -->
      <circle cx="20" cy="12" r="2" opacity="0.5"/>
      <circle cx="26" cy="18" r="2" opacity="0.5"/>
      <circle cx="20" cy="28" r="2" opacity="0.5"/>
      <circle cx="14" cy="18" r="2" opacity="0.5"/>
    </g>
    
    <!-- "D" letter -->
    <path d="M16 12 L16 28 L22 28 Q26 28 26 20 Q26 12 22 12 Z" 
          fill="url(#culturalGradient)"/>
  </g>
  
  <!-- Compact text -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="25" 
          font-size="16" 
          font-weight="700"
          fill="url(#culturalGradient)" 
          letter-spacing="-0.3px">Desi</text>
    
    <text x="50" y="40" 
          font-size="11" 
          font-weight="600"
          fill="#1e293b" 
          letter-spacing="-0.2px">Digital Hub</text>
  </g>
</svg>
